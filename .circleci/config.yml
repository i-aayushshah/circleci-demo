  #   docker:
  #     - image: cimg/base:stable
  #   steps:
  #     - checkout
  #     - setup_remote_docker:
  #         version: default
  #     - run:
  #         name: Build and push image
  #         command: |
  #           echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
  #           docker build -t "$IMAGE_NAME:$CIRCLE_SHA1" .
  #           docker push "$IMAGE_NAME:$CIRCLE_SHA1"
  #           echo "Deployed image $IMAGE_NAME:$CIRCLE_SHA1"

  # Example 2: Static site to AWS S3 + CloudFront (needs ./dist from a build step).
  # Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, S3_BUCKET_NAME, CLOUDFRONT_ID
