version: 2.1

jobs:

  build:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pip install -r requirements.txt
      - run:
          name: Check syntax
          command: python -m py_compile main.py && echo "Build successful"

  test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pip install -r requirements.txt
      - run:
          name: Run tests
          command: pytest test_main.py -v

  deploy:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Deploy
          command: echo "Tests passed. Deploying branch $CIRCLE_BRANCH..."

  # Real deploy examples (commented). Uncomment one block and replace the deploy job above.
  # Set secrets in CircleCI: Project Settings -> Environment Variables (never commit them).

  # Example 1: Docker build and push to a registry (needs Dockerfile in repo root).
  # Secrets: DOCKER_USER, DOCKER_PASS, IMAGE_NAME
